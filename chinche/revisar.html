<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Revisar chinche</title><style>body{font:16px system-ui;background:#f7f5ed;color:#263c30;max-width:1100px;margin:32px auto;padding:16px}input,button{font:inherit;padding:12px}form{display:flex;gap:8px;flex-wrap:wrap}input{flex:1;min-width:200px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>Revisar explicación</h1><p>Abre tu sesión de YOD OS y busca la chinche por su ID. El audio y las capturas se recuperan del archivo privado.</p><form id="lookup"><input id="pin" aria-label="ID de chinche" placeholder="CHN-…" required><button>Abrir explicación</button></form><p id="status" role="status"></p><h2 id="title"></h2><pre id="note"></pre><div id="player"></div><script src="secuencia.js?v=1"></script><script src="entrega.js?v=1"></script><script>
'use strict';const form=document.getElementById('lookup'),host=document.getElementById('player'),status=document.getElementById('status');document.getElementById('pin').value=new URL(location.href).searchParams.get('id')||'';form.onsubmit=async e=>{e.preventDefault();const id=document.getElementById('pin').value.trim();if(!/^CHN-\d{8}-\d{4}-[a-f0-9]{4}$/.test(id)){status.textContent='Revisa el ID.';return;}form.querySelector('button').disabled=true;status.textContent='Recuperando y comprobando el archivo…';try{host.querySelectorAll('audio').forEach(a=>a.pause());host.replaceChildren();const p=await YodChincheEntrega.client().read(id);await YodChincheSecuencia.replay(host,p.secuencia);document.getElementById('title').textContent=p.pantalla||p.repo;document.getElementById('note').textContent=p.texto||'';status.textContent='Archivo completo verificado · '+id;}catch(err){status.textContent=err.message;}finally{form.querySelector('button').disabled=false;}};
</script></html>
