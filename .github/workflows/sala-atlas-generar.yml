name: Regenerar atlas de la Sala
on:
  push:
    branches: [codex/sala-tablero-hidream-20261013]
    paths: [docs/arquitectura/modelo.json]
permissions:
  contents: write
jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/arquitectura.cjs
      - run: node scripts/arquitectura.cjs --check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/arquitectura
          git diff --cached --quiet || git commit -m 'Sincronizar atlas de Sala con cambios concurrentes'
          git push origin HEAD:codex/sala-tablero-hidream-20261013
