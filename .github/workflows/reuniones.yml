name: Reuniones recuperables
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fastapi==0.115.12 httpx==0.28.1 pytest requests google-auth
      - run: pytest -q reuniones/service/test_store.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/reuniones.test.cjs
  iphone:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: reuniones/mobile/ios
      - name: Compilar iPhone Simulator sin firma
        run: |
          set -o pipefail
          xcodebuild -project YodReuniones.xcodeproj -scheme YodReuniones -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -configuration Debug -derivedDataPath /tmp/yod-iphone CODE_SIGNING_ALLOWED=NO build 2>&1 | tee /tmp/yod-build.log
        working-directory: reuniones/mobile/ios
      - name: Diagnóstico de compilación
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/yod-build.log')
          if p.exists():
            lines=p.read_text().splitlines()
            errors=[line for line in lines if 'error:' in line.lower() or 'failed' in line.lower()]
            for line in lines[-35:]:
              print('::error::'+line.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: YOD-Reuniones-iPhone-Simulator
          path: /tmp/yod-iphone/Build/Products/Debug-iphonesimulator/YodReuniones.app
