name: Preparar vistas del atlas de recibos
on:
  push:
    branches: [codex/sala-recibos-fallo-confirmado]
permissions:
  contents: write
jobs:
  vistas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node scripts/arquitectura.cjs
      - run: node scripts/arquitectura.cjs --check
      - name: Guardar vistas generadas en esta rama
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'codex'
          git config user.email 'codex@users.noreply.github.com'
          git add docs/arquitectura
          git diff --cached --quiet && exit 0
          git commit -m 'docs: regenerar atlas de recuperacion de recibos'
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:codex/sala-recibos-fallo-confirmado
