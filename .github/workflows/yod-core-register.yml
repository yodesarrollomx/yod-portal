name: Register YOD Core architecture
on:
  push:
    branches: [codex/yod-core-fundacion-20261017]
permissions:
  contents: read
concurrency:
  group: yod-core-registration
  cancel-in-progress: false
jobs:
  register:
    if: github.repository == 'yodesarrollomx/yod-portal' && github.ref == 'refs/heads/codex/yod-core-fundacion-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Register proposal and regenerate architecture views
        run: node scripts/registrar-yod-core.cjs
      - name: Verify generated source before recording
        run: |
          node scripts/arquitectura.cjs --check
          node --test tests/*.cjs yod-core/tests/*.cjs
          node verify-os.cjs
          node verify-portal.cjs
          node verify-accesos.cjs
          node verify-obra-app.cjs
      - name: Record only generated architecture in this working branch
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          git diff --name-only | grep -Ev '^(architecture-impact.json|docs/arquitectura/(modelo.json|contratos.md|fichas.md|index.html|mapas.md|oficina-cobertura.html|oficina-cobertura.md|procesos.md|propuestas.md))$' > /tmp/unexpected || true
          test ! -s /tmp/unexpected
          git add architecture-impact.json docs/arquitectura/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(yod-core): register validated architecture and generated views'
          BASE_SHA=$(git merge-base origin/main HEAD) HEAD_SHA=$(git rev-parse HEAD) node scripts/verificar-impacto.cjs
          CURRENT_SHA=$(git ls-remote origin refs/heads/codex/yod-core-fundacion-20261017 | cut -f1)
          test "$CURRENT_SHA" = "$EXPECTED_SHA"
          git push origin HEAD:refs/heads/codex/yod-core-fundacion-20261017
