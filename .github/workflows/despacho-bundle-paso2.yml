name: Compilar puesto paso 2
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'despacho-agents/**'
      - 'despacho3d/goals.mjs'
      - '.github/workflows/despacho-bundle-paso2.yml'
permissions:
  contents: read
concurrency:
  group: despacho-bundle-paso2-104
  cancel-in-progress: true
jobs:
  build:
    if: >-
      github.repository == 'yodesarrollomx/yod-portal' &&
      github.event.pull_request.head.repo.full_name == 'yodesarrollomx/yod-portal' &&
      github.event.pull_request.head.ref == 'codex/despacho-puesto-recuperacion-104' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leonvanzyl/cubefarm
          ref: 11237cf554f21312a2aecd9758d611f2817fc71e
          path: .build/cubefarm
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Instalar dependencias fijadas sin scripts de instalación
        working-directory: .build/cubefarm
        run: npm ci --ignore-scripts --include=dev --include=optional --no-audit --no-fund
      - name: Compilar los dos artefactos desde su fuente
        run: |
          node despacho-agents/build.mjs "$GITHUB_WORKSPACE/.build/cubefarm"
          node --input-type=module --check < despacho3d/agents.js
          test -s despacho3d/agents.css
          sha256sum despacho3d/agents.js despacho3d/agents.css
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: puesto-paso2-${{ github.event.pull_request.head.sha }}
          path: |
            despacho3d/agents.js
            despacho3d/agents.css
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: build
    if: >-
      github.repository == 'yodesarrollomx/yod-portal' &&
      github.event.pull_request.head.repo.full_name == 'yodesarrollomx/yod-portal' &&
      github.event.pull_request.head.ref == 'codex/despacho-puesto-recuperacion-104' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: puesto-paso2-${{ github.event.pull_request.head.sha }}
          path: compiled
      - name: Guardar sólo los artefactos compilados en la rama autorizada
        env:
          TARGET_BRANCH: codex/despacho-puesto-recuperacion-104
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$EXPECTED_SHA"
          test -s compiled/agents.js
          test -s compiled/agents.css
          test ! -L compiled/agents.js
          test ! -L compiled/agents.css
          cp compiled/agents.js despacho3d/agents.js
          cp compiled/agents.css despacho3d/agents.css
          git add -- despacho3d/agents.js despacho3d/agents.css
          if git diff --cached --quiet; then
            echo 'Los artefactos ya coinciden con la fuente.'
            exit 0
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: regenerar puesto desde fuente revisada'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
