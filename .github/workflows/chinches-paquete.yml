name: Paquete de chinches
on:
  pull_request:
    paths: ['chinche/**', 'chinche.js', 'scripts/chinches-*.cjs', 'tests/chinches-*.test.cjs', '.github/workflows/chinches-paquete.yml']
  push:
    branches: [main]
    paths: ['chinche/**', 'chinche.js', 'scripts/chinches-*.cjs', 'tests/chinches-*.test.cjs', '.github/workflows/chinches-paquete.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contrato-y-registro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Assets, releases, registro y vistas coherentes
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node scripts/chinches-paquete.cjs verificar
          node scripts/chinches-reporte.cjs --check
          if [ -n "$RELEASE_BASE" ] && [ "$RELEASE_BASE" != "0000000000000000000000000000000000000000" ]; then
            node scripts/chinches-reporte.cjs --check --base-ref "$RELEASE_BASE"
          fi
      - name: Instalación, conflictos y revisión incremental
        run: node --test tests/chinches-paquete.test.cjs tests/chinches-revision.test.cjs tests/chinches-reporte.test.cjs tests/chinches-estado.test.cjs
