name: Conocimiento del Despacho
on:
  push:
    branches: [main]
    paths:
      - 'despacho3d/**'
      - 'os/despacho-section.js'
      - 'scripts/probar-entrada-publicada.cjs'
      - '.github/workflows/conocimiento-browser.yml'
  pull_request:
    paths:
      - 'despacho3d/**'
      - 'scripts/probar-oficina-panoramica-browser.cjs'
      - 'scripts/probar-trabajo-browser.cjs'
      - 'scripts/probar-entrada-browser.cjs'
      - 'scripts/probar-conocimiento-browser.cjs'
      - 'scripts/probar-voz-ux-browser.cjs'
      - 'scripts/probar-ppp-colaborativo-browser.cjs'
      - '.github/workflows/conocimiento-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Accesos del PPP previsto
        env:
          ACCESOS_REF: eff67c2dccfb762ca52365255945daefee678861
        run: node verify-accesos.cjs
      - name: Preparar Chromium aislado
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          printf '%s\n' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' 'Acquire::Retries "2";' | sudo tee /etc/apt/apt.conf.d/80-yod-timeout >/dev/null
          npm install --prefix "$RUNNER_TEMP/yod-knowledge-browser" --no-package-lock --ignore-scripts playwright@1.51.1
          node "$RUNNER_TEMP/yod-knowledge-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Comprobar entrada publicada sin sesión privada
        if: github.event_name == 'push'
        env:
          NODE_PATH: ${{ runner.temp }}/yod-knowledge-browser/node_modules
          BROWSER_EVIDENCE_DIR: ${{ runner.temp }}/knowledge-evidence
        run: node scripts/probar-entrada-publicada.cjs
      - name: Entrada, identidad y puesto
        timeout-minutes: 6
        env:
          NODE_PATH: ${{ runner.temp }}/yod-knowledge-browser/node_modules
          BROWSER_EVIDENCE_DIR: ${{ runner.temp }}/knowledge-evidence
        run: node scripts/probar-entrada-browser.cjs
      - name: Reunión, guion y entrega
        timeout-minutes: 2
        env:
          NODE_PATH: ${{ runner.temp }}/yod-knowledge-browser/node_modules
          BROWSER_EVIDENCE_DIR: ${{ runner.temp }}/knowledge-evidence
        run: node scripts/probar-reunion-browser.cjs
      - name: Trabajo observable
        timeout-minutes: 3
        env:
          NODE_PATH: ${{ runner.temp }}/yod-knowledge-browser/node_modules
          BROWSER_EVIDENCE_DIR: ${{ runner.temp }}/knowledge-evidence
        run: node scripts/probar-trabajo-browser.cjs
      - name: Recorrido real y encuentro por cercanía
        timeout-minutes: 4
        env:
          NODE_PATH: ${{ runner.temp }}/yod-knowledge-browser/node_modules
          BROWSER_EVIDENCE_DIR: ${{ runner.temp }}/knowledge-evidence
        run: node scripts/probar-oficina-panoramica-browser.cjs
      - name: Conocimiento y recibos
        timeout-minutes: 3
        env:
          NODE_PATH: ${{ runner.temp }}/yod-knowledge-browser/node_modules
          BROWSER_EVIDENCE_DIR: ${{ runner.temp }}/knowledge-evidence
        run: node scripts/probar-conocimiento-browser.cjs
      - name: Voz, permisos y cierre
        timeout-minutes: 3
        env:
          NODE_PATH: ${{ runner.temp }}/yod-knowledge-browser/node_modules
          BROWSER_EVIDENCE_DIR: ${{ runner.temp }}/knowledge-evidence
        run: node scripts/probar-voz-ux-browser.cjs
      - name: PPP colaborativo
        timeout-minutes: 3
        env:
          NODE_PATH: ${{ runner.temp }}/yod-knowledge-browser/node_modules
          BROWSER_EVIDENCE_DIR: ${{ runner.temp }}/knowledge-evidence
        run: node scripts/probar-ppp-colaborativo-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conocimiento-escritorio-movil
          path: ${{ runner.temp }}/knowledge-evidence
          if-no-files-found: ignore
