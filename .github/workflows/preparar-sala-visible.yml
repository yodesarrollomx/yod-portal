name: Preparar atlas Sala visible
on:
  push:
    branches: [codex/atlas-sala-visible-20261017]
permissions:
  contents: write
jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/arquitectura.cjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/arquitectura
          git diff --cached --quiet || git commit -m "Regenerar atlas para mesa visible"
          git push
      - run: |
          node scripts/arquitectura.cjs --check
          node --test tests/*.cjs
          node verify-os.cjs
          node verify-portal.cjs
          node verify-accesos.cjs
          node verify-obra-app.cjs
