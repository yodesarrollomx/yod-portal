name: Vigía · YOD OS (el único vigilante)

on:
  schedule:
    - cron: '7 14 * * *'   # 07:07 America/Hermosillo (UTC-7 fijo, sin horario de verano) · reporte del día
    - cron: '37 * * * *'   # cada hora: solo avisa si algo se rompe (25-sep-2026: absorbe los
                           # guardianes de aurum-board —uptime y refresco— y la salud de Amalaya)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  vigia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pruebas de código (verify-os / verify-portal)
        id: pruebas
        run: |
          set +e
          { node verify-os.cjs && node verify-portal.cjs; } > pruebas.log 2>&1
          echo "codigo=$?" >> "$GITHUB_OUTPUT"
          cat pruebas.log

      - name: Salud de los tableros en vivo
        id: salud
        run: |
          urls=(
            "https://yodesarrollomx.github.io/yod-portal/"
            "https://yodesarrollomx.github.io/yod-portal/os/"
            "https://yodesarrollomx.github.io/yod-portal/tablero.html"
            "https://yodesarrollomx.github.io/yod-portal/obra.html"
            "https://yodesarrollomx.github.io/yod-portal/track-codesarrollos.html"
            "https://yodesarrollomx.github.io/yod-despacho/"
            "https://yodesarrollomx.github.io/sala-edicion/"
            "https://yodesarrollomx.github.io/potenciales-yod/"
            "https://yodesarrollomx.github.io/real-miramar-board/"
            "https://yodesarrollomx.github.io/board-aurum/"
            "https://yodesarrollomx.github.io/board-flujo-yod/"
            "https://yodesarrollomx.github.io/interiores-aurum/"
            "https://yodesarrollomx.github.io/yodesarrollo-board/"
            "https://yodesarrollomx.github.io/aurum-board/"
          )
          roto=0
          echo "| Tablero | HTTP |" > salud.md
          echo "|---|---|" >> salud.md
          for u in "${urls[@]}"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$u")
            [ "$code" != "200" ] && roto=1
            echo "| $u | $code |" >> salud.md
          done
          echo "roto=$roto" >> "$GITHUB_OUTPUT"

      # El Portero (Apps Script) es la cerradura de todos los tableros: si no contesta JSON,
      # el login con Google dice «No se pudo con Google: servidor». Solo GET con un token falso:
      # respuesta sana = {"ok":false,"error":"liga"} (potenciales-yod/CLAUDE.md). Nunca POST.
      - name: Portero vivo (solo lectura)
        id: portero
        run: |
          # La dirección sale de la única copia: os/yod-acceso.js
          declare -A ep=(
            [original]="$(node -p "require('./os/yod-acceso.js').original")"
            [respaldo]="$(node -p "require('./os/yod-acceso.js').respaldo")"
          )
          sano=0
          echo "| Portero | HTTP | Tarda | Contesta |" > portero.md
          echo "|---|---|---|---|" >> portero.md
          for k in original respaldo; do
            out=$(curl -sL --max-time 30 -o cuerpo.txt -w "%{http_code} %{time_total}" "${ep[$k]}?recurso=canje&t=zzz" || echo "000 30")
            code=${out%% *}; t=${out##* }
            if python3 -c "import json;json.load(open('cuerpo.txt'))" 2>/dev/null; then
              que="JSON: $(head -c 120 cuerpo.txt | tr '\n|' '  ')"; sano=1
            else
              tit=$(grep -o '<title>[^<]*' cuerpo.txt | head -1 | sed 's/<title>//')
              que="NO es JSON · título: ${tit:-(vacío)} · $(sed 's/<[^>]*>//g' cuerpo.txt | tr -s ' \n' ' ' | head -c 160 | tr '|' ' ')"
            fi
            echo "| $k | $code | ${t}s | $que |" >> portero.md
          done
          cat portero.md
          echo "caido=$([ $sano = 1 ] && echo 0 || echo 1)" >> "$GITHUB_OUTPUT"

      # ── Amalaya (repo aparte: yodesarrollo/amalaya-board) ─────────────────────
      # Mismo vigía, bloque separado: la página responde 200, el /exec contesta el
      # GET de salud (doGet → {"ok":true,...}; nunca POST) y npm run pruebas pasa.
      - name: Amalaya · traer el repo (público, solo lectura)
        uses: actions/checkout@v4
        with:
          repository: yodesarrollo/amalaya-board
          path: amalaya

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Amalaya · página, /exec y pruebas
        id: amalaya
        run: |
          set +e
          mal=0
          pag=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://yodesarrollo.github.io/amalaya-board/")
          [ "$pag" != "200" ] && mal=1
          exec_url=$(grep -oE "https://script.google.com/macros/s/[A-Za-z0-9_-]+/exec" amalaya/src/config.js | head -1)
          salud=$(curl -sL --max-time 30 "$exec_url")
          if echo "$salud" | python3 -c "import json,sys;d=json.load(sys.stdin);sys.exit(0 if d.get('ok') is True else 1)" 2>/dev/null; then
            exec_estado="✅ ok"
          else
            exec_estado="🔴 no contesta JSON sano"; mal=1
          fi
          (cd amalaya && npm ci --no-audit --no-fund >/dev/null 2>&1 && npm run pruebas) > amalaya-pruebas.log 2>&1
          pr=$?
          [ "$pr" != "0" ] && mal=1
          {
            echo "| Pieza | Estado |"
            echo "|---|---|"
            echo "| Página https://yodesarrollo.github.io/amalaya-board/ | HTTP $pag |"
            echo "| /exec (GET de salud) | $exec_estado |"
            echo "| npm run pruebas | $([ $pr = 0 ] && echo '✅ pasan' || echo '🔴 fallan') |"
          } > amalaya.md
          cat amalaya.md
          echo "mal=$mal" >> "$GITHUB_OUTPUT"

      # ── Lo que antes vigilaban otros guardianes (25-sep-2026) ──────────────────
      # aurum-board/guardian-uptime: los backends por donde ENTRAN los leads.
      # aurum-board/guardian-salud: que el refresco de métricas haya corrido bien.
      # Y las dos puertas de la Sala. Solo GET y lectura de la API pública de Actions.
      - name: Leads, refrescos y automatizaciones
        id: extra
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mal=0
          echo "| Pieza | Estado |" > extra.md
          echo "|---|---|" >> extra.md
          # Backend del Plan de Potencial: lo sano SIN credencial es que el Portero lo rechace («liga»)
          r=$(curl -sL --max-time 30 "https://script.google.com/macros/s/AKfycbw3EB-6Q9Mq-ouDU-JvKMrRUaw4auYVeGkKja783yJ7_dEpCOW8xoMhs8IQMDojmlDB3A/exec?recurso=board")
          if echo "$r" | python3 -c "import json,sys;d=json.load(sys.stdin);sys.exit(0 if d.get('error')=='liga' or d.get('ok') is True else 1)" 2>/dev/null; then e="✅ contesta"; else e="🔴 no contesta JSON"; mal=1; fi
          echo "| Backend · Plan de Potencial (leads) | $e |" >> extra.md
          r=$(curl -sL --max-time 30 "https://script.google.com/macros/s/AKfycbztAKA7K5QwO6k45PqjixYLNppLypzCpoz2KvNIkML8kciBLZVKKoais8__0DnYuEQQOg/exec?recurso=textos")
          if echo "$r" | python3 -c "import json,sys;json.load(sys.stdin)" 2>/dev/null; then e="✅ contesta"; else e="🔴 no contesta JSON"; mal=1; fi
          echo "| Backend · Cuestionario (leads) | $e |" >> extra.md
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://aurumarquitectos.github.io/experiencia/")
          [ "$code" != "200" ] && mal=1
          echo "| Página · Cuestionario | HTTP $code |" >> extra.md
          # Última corrida EXITOSA de cada automatización y su edad en horas
          revisa() { # repo workflow umbral_horas nombre
            ts=$(gh api "repos/$1/actions/workflows/$2/runs?status=success&per_page=1" --jq '.workflow_runs[0].updated_at' 2>/dev/null)
            if [ -z "$ts" ] || [ "$ts" = "null" ]; then echo "| $4 | ⚪ sin corridas exitosas todavía |" >> extra.md; return; fi
            h=$(( ( $(date -u +%s) - $(date -u -d "$ts" +%s) ) / 3600 ))
            if [ "$h" -gt "$3" ]; then echo "| $4 | 🔴 última buena hace ${h} h |" >> extra.md; mal=1; else echo "| $4 | ✅ hace ${h} h |" >> extra.md; fi
          }
          revisa yodesarrollomx/aurum-board refresh-board.yml 4 "Refresco de métricas (aurum-board)"
          revisa yodesarrollomx/sala-edicion sala-cada-hora.yml 3 "Sala · Cada hora"
          revisa yodesarrollomx/sala-edicion sala-diario.yml 26 "Sala · Diario"
          revisa yodesarrollomx/sala-edicion publicar.yml 720 "Sala · Publicar"
          cat extra.md
          echo "mal=$mal" >> "$GITHUB_OUTPUT"

      - name: Asegurar etiquetas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "vigia" --color "0E8A16" --description "Reporte automático del vigía diario" --force
          gh label create "atencion" --color "D93F0B" --description "El vigía encontró algo roto" --force

      - name: Publicar el reporte del día
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          titulo="🔎 Vigía diario · YOD OS"
          numero=$(gh issue list --search "in:title \"$titulo\"" --state open --json number,title --jq ".[] | select(.title==\"$titulo\") | .number" | head -n1)
          if [ -z "$numero" ]; then
            numero=$(gh issue create --title "$titulo" --body "Bitácora diaria del vigía automático. Cada corrida agrega un comentario abajo." --label "vigia" | grep -oE '[0-9]+$')
          fi

          estado="✅ todo bien"
          if [ "${{ steps.pruebas.outputs.codigo }}" != "0" ] || [ "${{ steps.salud.outputs.roto }}" = "1" ] || [ "${{ steps.portero.outputs.caido }}" = "1" ] || [ "${{ steps.amalaya.outputs.mal }}" = "1" ] || [ "${{ steps.extra.outputs.mal }}" = "1" ]; then
            estado="🔴 hay algo que revisar"
          fi
          # La corrida de cada hora solo habla si algo está roto; el reporte completo es el de las 07:07
          if [ "$estado" = "✅ todo bien" ] && [ "${{ github.event.schedule }}" = "37 * * * *" ]; then
            echo "Todo bien; la corrida de cada hora no comenta."; exit 0
          fi

          {
            echo "## $estado — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "### Pruebas de código"
            echo '```'
            cat pruebas.log
            echo '```'
            echo
            echo "### Tableros en vivo"
            cat salud.md
            echo
            echo "### Portero (login de todos los tableros)"
            cat portero.md
            echo
            echo "### Leads y automatizaciones"
            cat extra.md
            echo
            echo "### Amalaya (bloque aparte · yodesarrollo/amalaya-board)"
            cat amalaya.md
            if ! grep -q "✅ pasan" amalaya.md; then
              echo
              echo '```'
              tail -n 30 amalaya-pruebas.log
              echo '```'
            fi
          } > comentario.md

          gh issue comment "$numero" --body-file comentario.md

          if [ "$estado" = "🔴 hay algo que revisar" ]; then
            gh issue edit "$numero" --add-label "atencion"
          else
            gh issue edit "$numero" --remove-label "atencion" 2>/dev/null || true
          fi
